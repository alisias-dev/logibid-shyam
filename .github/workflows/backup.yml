name: Database Backup

# Runs daily at 00:00 UTC (05:30 IST) plus on manual trigger.
# Free-tier budget guardrails:
#   - 1 run/day  -> ~30 runs/month, each well under 5 min of compute
#   - Only pg + dotenv installed (scripts/package.json), not the whole app
#   - Artifacts auto-deleted after 7 days (retention-days), max-compressed
#     (compression-level 9) so 500 MB artifact storage is never approached
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

# Never run two backups at once (avoids overlapping runs burning minutes).
concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Full snapshot + archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write   # required to upload workflow artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Minimal install: only the backup scripts' dependencies (pg, dotenv)
      # from scripts/package-lock.json. Do NOT npm ci the full app - the
      # workflow never runs application code, so that would waste compute
      # minutes for nothing.
      - name: Install minimal dependencies
        run: npm ci --prefix scripts

      - name: Run backup
        id: backup
        env:
          # Production pooled connection string (PgBouncer). Must be added as a
          # repository secret: Settings > Secrets and variables > Actions.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/backup.mjs

      - name: Verify snapshot integrity
        run: |
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const dirs = fs.readdirSync("backups").filter(d =>
              fs.existsSync("backups/" + d + "/manifest.json"));
            if (dirs.length === 0) { console.error("No backup snapshot found"); process.exit(1); }
            const dir = "backups/" + dirs.sort().pop();
            const man = JSON.parse(fs.readFileSync(dir + "/manifest.json", "utf8"));
            const tables = Object.keys(man.tables);
            console.log("Verifying " + tables.length + " tables in " + dir);
            for (const t of tables) {
              const f = dir + "/" + t + ".json";
              if (!fs.existsSync(f)) { console.error("MISSING " + f); process.exit(1); }
              const buf = fs.readFileSync(f);
              const hash = crypto.createHash("sha256").update(buf).digest("hex");
              const rows = JSON.parse(buf.toString("utf8"));
              if (hash !== man.tables[t].sha256) { console.error("HASH MISMATCH " + t); process.exit(1); }
              if (rows.length !== man.tables[t].rows) { console.error("ROW COUNT MISMATCH " + t); process.exit(1); }
            }
            console.log("Integrity OK - all " + tables.length + " tables verified (checksums + row counts)");
          '

      # Free-tier guardrails:
      #   - retention-days: 7  -> GitHub auto-deletes old snapshots, keeping
      #     artifact storage ~7 snapshots (~1 MB) instead of growing to 90.
      #   - compression-level: 9 -> maximum zlib compression on the archive;
      #     the JSON snapshots are highly compressible (typically 5-10x).
      - name: Archive snapshot (GitHub artifact, 7-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: fleexbid-backup-${{ github.run_number }}
          path: backups/
          retention-days: 7
          compression-level: 9
          if-no-files-found: error

      # Optional: mirror the snapshot to S3 / Cloudflare R2 for permanent
      # offsite retention. Runs only when the secrets below are configured
      # (secrets cannot be referenced in step-level if:, so the script checks).
      - name: Upload to S3 / R2 (optional)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID}" ] || [ -z "${AWS_S3_BUCKET}" ]; then
            echo "S3/R2 secrets not configured - skipping mirror (artifact archive is still uploaded)"
            exit 0
          fi
          ENDPOINT="${AWS_ENDPOINT_URL:-https://s3.${AWS_REGION:-us-east-1}.amazonaws.com}"
          aws s3 sync backups/ "s3://${AWS_S3_BUCKET}/fleexbid-backups/" --endpoint-url "$ENDPOINT"
          echo "Mirrored snapshot to s3://${AWS_S3_BUCKET}/fleexbid-backups/"

      # Failure alerting: always logs a clear error; if ALERT_WEBHOOK_URL is set
      # (e.g. ntfy.sh, Slack/Discord incoming webhook), posts the failure there.
      # GitHub also emails repo admins on failed scheduled runs.
      - name: Alert on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.ALERT_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "::error::FleexBid backup workflow FAILED - investigate immediately: $RUN_URL"
          if [ -n "$WEBHOOK" ]; then
            curl -s -X POST "$WEBHOOK" \
              -H 'Content-Type: application/json' \
              -d "{\"text\":\"🚨 FleexBid database backup FAILED: $RUN_URL\"}" \
              || echo "Webhook POST failed (non-fatal)"
          else
            echo "ALERT_WEBHOOK_URL not set - relying on GitHub's native failure email."
          fi
